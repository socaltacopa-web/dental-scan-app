<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dental Scan 3D Viewer</title>
<style>body{margin:0;background:#080b0e;color:white;font-family:system-ui}.bar{padding:10px 12px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}canvas{display:block;width:100vw;height:calc(100vh - 58px)}.muted{color:#aab3bd}</style>
</head>
<body>
<div class="bar"><strong>3D Point Cloud Viewer</strong><input id="file" type="file" accept=".ply"><span class="muted">Drag to rotate · wheel to zoom</span></div>
<canvas id="c"></canvas>
<script>
const canvas=document.getElementById("c"),ctx=canvas.getContext("2d");let pts=[],rx=-.25,ry=.25,zoom=1,drag=false,lx=0,ly=0;
function resize(){const d=devicePixelRatio||1;canvas.width=innerWidth*d;canvas.height=(innerHeight-58)*d;ctx.setTransform(d,0,0,d,0,0);draw()}addEventListener("resize",resize);
async function parse(text){const lines=text.split(/\r?\n/),end=lines.findIndex(x=>x.trim()==="end_header"),header=lines.slice(0,end+1),hasColor=header.some(x=>x.includes("property uchar red")),raw=lines.slice(end+1).map(l=>l.trim().split(/\s+/).map(Number)).filter(v=>v.length>=3&&v.slice(0,3).every(Number.isFinite));if(!raw.length)return;const xs=raw.map(p=>p[0]),ys=raw.map(p=>p[1]),zs=raw.map(p=>p[2]),cx=(Math.min(...xs)+Math.max(...xs))/2,cy=(Math.min(...ys)+Math.max(...ys))/2,cz=(Math.min(...zs)+Math.max(...zs))/2,span=Math.max(Math.max(...xs)-Math.min(...xs),Math.max(...ys)-Math.min(...ys),Math.max(...zs)-Math.min(...zs))||1;pts=raw.map(p=>({p:[(p[0]-cx)/span,(p[1]-cy)/span,(p[2]-cz)/span],c:hasColor&&p.length>=6?`rgb(${p[3]},${p[4]},${p[5]})`:"#eef2f6"}));draw()}
document.getElementById("file").addEventListener("change",async e=>{if(e.target.files[0])parse(await e.target.files[0].text())});
function rot([x,y,z]){const cy=Math.cos(ry),sy=Math.sin(ry),cx=Math.cos(rx),sx=Math.sin(rx),x1=cy*x+sy*z,z1=-sy*x+cy*z,y1=cx*y-sx*z1,z2=sx*y+cx*z1;return[x1,y1,z2]}
function draw(){const w=canvas.clientWidth,h=canvas.clientHeight;ctx.clearRect(0,0,w,h);if(!pts.length){ctx.fillStyle="#b8c2cc";ctx.font="18px system-ui";ctx.fillText("Loading model…",20,35);return}const size=Math.min(w,h)*.9*zoom,pr=pts.map(o=>{const[x,y,z]=rot(o.p),d=2.25+z;return{x:w/2+x*size/d,y:h/2-y*size/d,z,c:o.c}}).sort((a,b)=>a.z-b.z);for(const q of pr){ctx.fillStyle=q.c;ctx.fillRect(q.x,q.y,1.6,1.6)}}
canvas.addEventListener("pointerdown",e=>{drag=true;lx=e.clientX;ly=e.clientY;canvas.setPointerCapture(e.pointerId)});canvas.addEventListener("pointermove",e=>{if(!drag)return;ry+=(e.clientX-lx)*.008;rx+=(e.clientY-ly)*.008;lx=e.clientX;ly=e.clientY;draw()});canvas.addEventListener("pointerup",()=>drag=false);canvas.addEventListener("wheel",e=>{e.preventDefault();zoom=Math.max(.2,Math.min(6,zoom*(e.deltaY>0?.9:1.1)));draw()},{passive:false});
const scan=new URLSearchParams(location.search).get("scan");if(scan){fetch(`/api/scans/${scan}/artifacts/global/merged_mouth.ply`).then(r=>{if(!r.ok)throw new Error("Model not found");return r.text()}).then(parse).catch(e=>{ctx.fillStyle="#fff";ctx.fillText(e.message,20,35)})}else draw();resize();
</script>
</body></html>
