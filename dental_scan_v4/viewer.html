<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dental V4 Global Cloud Viewer</title>
<style>
body{margin:0;font-family:system-ui,sans-serif;background:#0a0d10;color:#fff}
.bar{padding:10px 12px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
canvas{display:block;width:100vw;height:calc(100vh - 62px);background:#05070a}.muted{color:#a9b2bc;font-size:.9rem}
</style></head>
<body>
<div class="bar"><strong>V4 Global Point Cloud Viewer</strong><input id="file" type="file" accept=".ply"><span class="muted">Open merged_mouth.ply · drag to rotate · wheel to zoom</span></div>
<canvas id="c"></canvas>
<script>
const canvas=document.getElementById("c"),ctx=canvas.getContext("2d");
let pts=[],rx=-.25,ry=.25,zoom=1,drag=false,lx=0,ly=0;
function resize(){const dpr=devicePixelRatio||1;canvas.width=innerWidth*dpr;canvas.height=(innerHeight-62)*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);draw()}
addEventListener("resize",resize);
document.getElementById("file").addEventListener("change",async e=>{
 const f=e.target.files[0];if(!f)return;const text=await f.text(),lines=text.split(/\r?\n/);
 const end=lines.findIndex(x=>x.trim()==="end_header"),header=lines.slice(0,end+1),hasColor=header.some(x=>x.includes("property uchar red"));
 const raw=lines.slice(end+1).map(l=>l.trim().split(/\s+/).map(Number)).filter(v=>v.length>=3&&v.slice(0,3).every(Number.isFinite));if(!raw.length)return;
 const xs=raw.map(p=>p[0]),ys=raw.map(p=>p[1]),zs=raw.map(p=>p[2]),cx=(Math.min(...xs)+Math.max(...xs))/2,cy=(Math.min(...ys)+Math.max(...ys))/2,cz=(Math.min(...zs)+Math.max(...zs))/2;
 const span=Math.max(Math.max(...xs)-Math.min(...xs),Math.max(...ys)-Math.min(...ys),Math.max(...zs)-Math.min(...zs))||1;
 pts=raw.map(p=>({p:[(p[0]-cx)/span,(p[1]-cy)/span,(p[2]-cz)/span],c:hasColor&&p.length>=6?`rgb(${p[3]},${p[4]},${p[5]})`:"rgb(235,240,245)"}));draw()
});
function rot([x,y,z]){const cy=Math.cos(ry),sy=Math.sin(ry),cx=Math.cos(rx),sx=Math.sin(rx),x1=cy*x+sy*z,z1=-sy*x+cy*z,y1=cx*y-sx*z1,z2=sx*y+cx*z1;return[x1,y1,z2]}
function draw(){const w=canvas.clientWidth,h=canvas.clientHeight;ctx.clearRect(0,0,w,h);if(!pts.length){ctx.fillStyle="#b8c2cc";ctx.font="18px system-ui";ctx.fillText("Choose merged_mouth.ply.",20,35);return}
 const size=Math.min(w,h)*.9*zoom,pr=pts.map(o=>{const[x,y,z]=rot(o.p),d=2.25+z;return{x:w/2+x*size/d,y:h/2-y*size/d,z,c:o.c}}).sort((a,b)=>a.z-b.z);
 for(const q of pr){ctx.fillStyle=q.c;ctx.fillRect(q.x,q.y,1.6,1.6)}
}
canvas.addEventListener("pointerdown",e=>{drag=true;lx=e.clientX;ly=e.clientY;canvas.setPointerCapture(e.pointerId)});
canvas.addEventListener("pointermove",e=>{if(!drag)return;ry+=(e.clientX-lx)*.008;rx+=(e.clientY-ly)*.008;lx=e.clientX;ly=e.clientY;draw()});
canvas.addEventListener("pointerup",()=>drag=false);
canvas.addEventListener("wheel",e=>{e.preventDefault();zoom=Math.max(.2,Math.min(6,zoom*(e.deltaY>0?.9:1.1)));draw()},{passive:false});
resize();
</script>
</body></html>
